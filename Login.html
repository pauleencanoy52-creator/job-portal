<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#070b16;
}

/* MAIN WRAPPER */
.wrapper{
    width:900px;
    height:550px;
    display:flex;
    border-radius:20px;
    overflow:hidden;
    background:#0f1424;
}

/* LEFT SIDE (FORM) */
.left{
    width:50%;
    padding:50px;
    color:#fff;
}

.left h1{
    margin-bottom:10px;
}

.left p{
    color:#aaa;
    margin-bottom:30px;
}

/* INPUTS */
input{
    width:100%;
    padding:14px;
    margin-bottom:15px;
    border:none;
    border-radius:10px;
    background:#1a2035;
    color:#fff;
}

input::placeholder{
    color:#888;
}

/* BUTTON */
button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:linear-gradient(90deg,#7c5cff,#9f7bff);
    color:#fff;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    opacity:0.9;
}

/* LINK */
.link{
    margin-top:20px;
    display:block;
    color:#9f7bff;
    text-decoration:none;
}

/* RIGHT SIDE */
.right{
    width:50%;
    background:linear-gradient(135deg,#7c5cff,#9f7bff);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px;
}

.card{
    background:rgba(255,255,255,0.1);
    padding:40px;
    border-radius:20px;
    color:#fff;
}

.card h2{
    font-size:32px;
    margin-bottom:10px;
}

.card p{
    opacity:0.9;
}
</style>

</head>

<body>

<div class="wrapper">

    <!-- LEFT SIDE -->
    <div class="left">
        <h1>Welcome Back</h1>
        <p>Login to your account</p>

        <form onsubmit="login(event)">
            <input id="username" type="email" placeholder="Email" required>
            <input id="password" type="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>

        <a href="register.html" class="link">No account? Register</a>
    </div>

    <!-- RIGHT SIDE -->
    <div class="right">
        <div class="card">
            <h2>Job Portal System</h2>
            <p>Login to explore jobs and opportunities</p>
        </div>
    </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const firebaseConfig = {
  apiKey: "AIzaSyAtFG9KPZgfZRGh8GlOI-hNHSXdI2IMuTw",
  authDomain: "job-portal-847bb.firebaseapp.com",
  projectId: "job-portal-847bb",
  storageBucket: "job-portal-847bb.firebasestorage.app",
  messagingSenderId: "463078712629",
  appId: "1:463078712629:web:38a5efbdb9b9e6538b987c",
  measurementId: "G-JZXSRYJLQ4"
};

// INIT FIREBASE
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// LOGIN FUNCTION
window.login = async function(e){

    e.preventDefault();

    let email = document.getElementById("username").value;
    let password = document.getElementById("password").value;

    // ✅ ONLY GMAIL ALLOWED
    if (!email.endsWith("@gmail.com")) {
        alert("Only @gmail.com emails are allowed.");
        return;
    }

    try {

        const userCredential =
            await signInWithEmailAndPassword(auth, email, password);

        const user = userCredential.user;

        // store session
        localStorage.setItem("currentUser", JSON.stringify({
            uid: user.uid,
            email: user.email
        }));

        alert("Login Successful!");

        // ADMIN CHECK
        if(user.email === "admin@gmail.com"){
            window.location = "dashboard.html";
        } else {
            window.location = "user-dashboard.html";
        }

    } catch(err) {
        alert(err.message);
    }
}

</script>

</body>
</html>
