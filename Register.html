<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Register</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#070b16;
}

/* MAIN CARD */
.wrapper{
    width:900px;
    height:550px;
    display:flex;
    border-radius:20px;
    overflow:hidden;
    background:#0f1424;
}

/* LEFT SIDE */
.left{
    width:50%;
    padding:50px;
    color:#fff;
}

.left h1{
    margin-bottom:10px;
}

.left p{
    color:#aaa;
    margin-bottom:30px;
}

/* INPUTS */
input{
    width:100%;
    padding:14px;
    margin-bottom:15px;
    border:none;
    border-radius:10px;
    background:#1a2035;
    color:#fff;
}

input::placeholder{
    color:#888;
}

/* BUTTON */
button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:linear-gradient(90deg,#7c5cff,#9f7bff);
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

/* LINK */
.back{
    margin-top:20px;
    display:block;
    color:#9f7bff;
    text-decoration:none;
}

/* RIGHT SIDE */
.right{
    width:50%;
    background:linear-gradient(135deg,#7c5cff,#9f7bff);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px;
}

.card{
    background:rgba(255,255,255,0.1);
    padding:40px;
    border-radius:20px;
    color:#fff;
}
</style>

</head>

<body>

<div class="wrapper">

    <!-- LEFT SIDE -->
    <div class="left">
        <h1>Create Account</h1>
        <p>Fill in your details</p>

        <form onsubmit="register(event)">
            <input id="name" placeholder="Full Name" required>
            <input id="username" placeholder="Username" required>
            <input id="email" type="email" placeholder="Email" required>
            <input id="password" type="password" placeholder="Password" required>
            <button type="submit">Register</button>
        </form>

        <a href="login.html" class="back">← Back to Login</a>
    </div>

    <!-- RIGHT SIDE -->
    <div class="right">
        <div class="card">
            <h2>Join the<br>Job Portal System</h2>
            <p>Create account to start applying jobs</p>
        </div>
    </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyAtFG9KPZgfZRGh8GlOI-hNHSXdI2IMuTw",
  authDomain: "job-portal-847bb.firebaseapp.com",
  projectId: "job-portal-847bb",
  storageBucket: "job-portal-847bb.firebasestorage.app",
  messagingSenderId: "463078712629",
  appId: "1:463078712629:web:38a5efbdb9b9e6538b987c",
  measurementId: "G-JZXSRYJLQ4"
};

// INIT
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// REGISTER
window.register = async function(e){

    e.preventDefault();

    let fullname = document.getElementById("name").value.trim();
    let username = document.getElementById("username").value.trim();
    let email = document.getElementById("email").value.trim();
    let password = document.getElementById("password").value;

    try {

        // CREATE AUTH USER
        const userCredential =
            await createUserWithEmailAndPassword(auth, email, password);

        const user = userCredential.user;

        // SAVE TO FIRESTORE
        await setDoc(doc(db, "users", user.uid), {
            fullname,
            username,
            email
        });

        alert("Registered successfully!");

        window.location = "login.html";

    } catch(err){

        console.error(err);
        alert("Error: " + err.message);
    }
}

</script>

</body>
</html>
