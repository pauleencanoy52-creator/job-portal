<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Applicants</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', sans-serif;
}

.container { display: flex; height: 100vh; }

.left {
    width: 25%;
    min-width: 240px;
    background: linear-gradient(135deg, #7b5cf0, #5a3ee6);
    color: #fff;
    padding: 30px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.menu a {
    display:block;
    color:#fff;
    text-decoration:none;
    padding:12px;
    border-radius:10px;
    margin-top:10px;
}

.menu a:hover { background: rgba(255,255,255,0.15); }

.menu a.active { background: rgba(255,255,255,0.25); }

.right {
    flex: 1;
    background: #f7f7ff;
    padding: 40px;
    overflow-y: auto;
}

.card {
    margin-top: 20px;
    background: #fff;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
}

.applicant {
    border: 1px solid #eee;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 15px;
}

.btn {
    background:#7b5cf0;
    color:#fff;
    border:none;
    padding:8px 12px;
    border-radius:8px;
    cursor:pointer;
    margin-right:5px;
}

.btn:hover { background:#5a3ee6; }
.btn.success { background:#28c76f; }
.btn.danger { background:#ea5455; }
.btn.secondary { background:#17a2b8; }
</style>
</head>

<body>

<div class="container">

<!-- SIDEBAR -->
<div class="left">
    <div>
        <h2>Job Portal</h2>

        <div class="menu">
            <a href="dashboard.html">Dashboard</a>
            <a href="job-post.html">Post Job</a>
            <a href="applicants.html" class="active">Applicants</a>
            <a href="interviews.html">Interviews</a>
            <a href="hired.html">Hired</a>

            <a href="#" onclick="logout()">Logout</a>
        </div>
    </div>
</div>

<!-- MAIN -->
<div class="right">

<h1>Applicants</h1>

<div class="card" id="applicantList"></div>

</div>
</div>

<script>

function logout(){
    localStorage.removeItem("currentUser");
    window.location = "login.html";
}

let applicants = JSON.parse(localStorage.getItem("applicants")) || [];
let jobs = JSON.parse(localStorage.getItem("jobs")) || [];

function addNotification(email, message, type){
    let notifications = JSON.parse(localStorage.getItem("notifications")) || [];

    notifications.push({
        email: (email || "").toLowerCase(),
        message,
        type,
        date: new Date().toLocaleString()
    });

    localStorage.setItem("notifications", JSON.stringify(notifications));
}

function renderApplicants(){

    const container = document.getElementById("applicantList");
    container.innerHTML = "";

    if(applicants.length === 0){
        container.innerHTML = "<p>No applicants yet.</p>";
        return;
    }

    applicants.forEach((a,i)=>{

        let job = jobs.find(j => j.title === a.position);

        let rating = 0;

        if(job?.skills?.length && Array.isArray(a.skills)){

            let jobSkills = job.skills.map(s => s.toLowerCase());
            let userSkills = a.skills.map(s => s.toLowerCase());

            let matched = jobSkills.filter(s => userSkills.includes(s));

            rating = Math.round((matched.length / jobSkills.length) * 100);
        }

        container.innerHTML += `
        <div class="applicant">
            <h3>${a.name}</h3>
            <p><b>Position:</b> ${a.position}</p>
            <p><b>Email:</b> ${a.email}</p>
            <p><b>Skills:</b> ${(a.skills || []).join(", ")}</p>
            <p><b>Match:</b> ${rating}%</p>

            <button class="btn secondary" onclick="viewApplicant(${i})">View</button>
            <button class="btn success" onclick="acceptApplicant(${i})">Accept</button>
            <button class="btn danger" onclick="rejectApplicant(${i})">Reject</button>
        </div>
        `;
    });
}

function viewApplicant(i){
    alert(`${applicants[i].name}
${applicants[i].position}
${applicants[i].email}`);
}

function acceptApplicant(i){

    let selected = applicants[i];

    let interviews = JSON.parse(localStorage.getItem("interviews")) || [];

    interviews.push({
        name: selected.name,
        email: selected.email,
        position: selected.position,
        skills: selected.skills || [],
        status: "Pending"
    });

    localStorage.setItem("interviews", JSON.stringify(interviews));

    addNotification(
        selected.email,
        "📅 Selected for interview: " + selected.position,
        "Scheduled"
    );

    applicants.splice(i,1);
    localStorage.setItem("applicants", JSON.stringify(applicants));

    renderApplicants();
}

function rejectApplicant(i){

    let selected = applicants[i];

    addNotification(
        selected.email,
        "❌ Rejected for: " + selected.position,
        "Rejected"
    );

    applicants.splice(i,1);
    localStorage.setItem("applicants", JSON.stringify(applicants));

    renderApplicants();
}

renderApplicants();

</script>

</body>
</html>
