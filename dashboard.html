<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', sans-serif;
}

.container {
    display: flex;
    height: 100vh;
}

/* SIDEBAR */
.left {
    width: 25%;
    min-width: 240px;
    background: linear-gradient(135deg, #7b5cf0, #5a3ee6);
    color: #fff;
    padding: 30px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.logo h2 { font-size: 24px; margin-bottom: 5px; }
.logo p { font-size: 13px; opacity: 0.9; }

.menu {
    margin-top: 30px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.menu a {
    color: #fff;
    text-decoration: none;
    padding: 12px 15px;
    border-radius: 10px;
}

.menu a:hover {
    background: rgba(255,255,255,0.15);
}

.right {
    flex: 1;
    background: #f5f6fa;
    padding: 40px;
    overflow-y: auto;
}

.card {
    margin-top: 25px;
    background: #e9e9ec;
    padding: 25px;
    border-radius: 20px;
}

.stats {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
}

.stat-box {
    flex: 1;
    min-width: 180px;
    background: #fff;
    padding: 20px;
    border-radius: 15px;
    text-align: center;
}

.stat-box h2 { color: #5a3ee6; }

.job-item{
    background:#fff;
    padding:18px;
    border-radius:15px;
    margin-bottom:15px;
}
</style>
</head>

<body>

<div class="container">

<!-- SIDEBAR -->
<div class="left">
    <div>
        <h2>Job Portal</h2>
        <p>Admin Panel</p>

        <div class="menu">
            <a href="dashboard.html">Dashboard</a>
            <a href="job-post.html">Post Job</a>
            <a href="applicants.html">Applicants</a>
            <a href="interviews.html">Interviews</a>
            <a href="hired.html">Hired</a>
            <a href="#" onclick="logout()">Logout</a>
        </div>
    </div>
</div>

<!-- MAIN -->
<div class="right">

    <h1>Dashboard</h1>

    <div class="card">

        <div class="stats">
            <div class="stat-box">
                <h2 id="totalJobs">0</h2>
                <p>Jobs</p>
            </div>

            <div class="stat-box">
                <h2 id="totalApplicants">0</h2>
                <p>Applicants</p>
            </div>

            <div class="stat-box">
                <h2 id="totalInterviews">0</h2>
                <p>Interviews</p>
            </div>

            <div class="stat-box">
                <h2 id="totalHired">0</h2>
                <p>Hired</p>
            </div>
        </div>

        <h2 style="margin-top:20px;">Recent Jobs</h2>
        <div id="jobContainer">Loading...</div>

    </div>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAtFG9KPZgfZRGh8GlOI-hNHSXdI2IMuTw",
  authDomain: "job-portal-847bb.firebaseapp.com",
  projectId: "job-portal-847bb"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

/// 🔐 PROTECT DASHBOARD
onAuthStateChanged(auth, (user) => {
    if (!user) {
        window.location = "index.html";
    }
});

/// 🚪 LOGOUT
window.logout = async function(){
    await signOut(auth);
    window.location = "index.html";
};

/// LOCAL STORAGE DATA
function getData(key){
    try {
        return JSON.parse(localStorage.getItem(key)) || [];
    } catch(e){
        return [];
    }
}

function loadData(){

    let jobs = getData("jobs");
    let applicants = getData("applicants");
    let interviews = getData("interviews");
    let hired = getData("hired");

    document.getElementById("totalJobs").innerText = jobs.length;
    document.getElementById("totalApplicants").innerText = applicants.length;
    document.getElementById("totalInterviews").innerText = interviews.length;
    document.getElementById("totalHired").innerText = hired.length;

    const container = document.getElementById("jobContainer");

    if(jobs.length === 0){
        container.innerHTML = "No jobs yet";
        return;
    }

    container.innerHTML = "";

    jobs.forEach(job => {
        container.innerHTML += `
            <div class="job-item">
                <h3>${job.title}</h3>
                <p>${job.company}</p>
                <small>${job.description}</small>
            </div>
        `;
    });
}

setInterval(loadData, 2000);
loadData();

</script>

</body>
</html>
