<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Job Portal</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#070b16;
}

/* MAIN WRAPPER */
.wrapper{
    width:900px;
    height:550px;
    display:flex;
    border-radius:20px;
    overflow:hidden;
    background:#0f1424;
}

/* LEFT SIDE */
.left{
    width:50%;
    padding:50px;
    color:#fff;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.left h1{
    margin-bottom:10px;
    font-size:40px;
}

.left p{
    color:#aaa;
    margin-bottom:30px;
    line-height:1.5;
}

/* INPUTS */
input{
    width:100%;
    padding:14px;
    margin-bottom:15px;
    border:none;
    border-radius:10px;
    background:#1a2035;
    color:#fff;
    outline:none;
}

input::placeholder{
    color:#888;
}

/* BUTTON */
button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:linear-gradient(90deg,#7c5cff,#9f7bff);
    color:#fff;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    opacity:0.9;
    transform:scale(1.02);
}

/* LINK */
.link{
    margin-top:20px;
    display:block;
    color:#9f7bff;
    text-decoration:none;
}

/* RIGHT SIDE */
.right{
    width:50%;
    background:linear-gradient(135deg,#7c5cff,#9f7bff);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px;
}

/* CARD */
.card{
    background:rgba(255,255,255,0.1);
    padding:40px;
    border-radius:20px;
    color:#fff;
    backdrop-filter:blur(10px);
}

.card h2{
    font-size:32px;
    margin-bottom:15px;
}

.card p{
    opacity:0.9;
    line-height:1.6;
}
</style>

</head>

<body>

<div class="wrapper">

    <!-- LEFT SIDE -->
    <div class="left">

        <h1>Welcome</h1>

        <p>
            Explore jobs and opportunities with our Job Portal System.
        </p>

        <form>

            <input type="email" placeholder="Email">

            <input type="password" placeholder="Password">

            <button type="button" onclick="enterSite()">
                Enter Portal
            </button>

        </form>

        <a href="#" class="link">
            Job Portal System
        </a>

    </div>

    <!-- RIGHT SIDE -->
    <div class="right">

        <div class="card">

            <h2>Job Portal System</h2>

            <p>
                Find opportunities, manage applications,
                and explore careers easily.
            </p>

        </div>

    </div>

</div>

<script>

function enterSite(){

    window.location = "user-dashboard.html";

}

</script>

</body>
</html>
