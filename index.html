<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial;
    background:#0b1020;
}

.box{
    width:350px;
    padding:30px;
    background:#141a2e;
    border-radius:15px;
    color:white;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:8px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#7b5cf0;
    color:white;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="box">
<h2>Login</h2>

<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAtFG9KPZgfZRGh8GlOI-hNHSXdI2IMuTw",
  authDomain: "job-portal-847bb.firebaseapp.com",
  projectId: "job-portal-847bb",
  storageBucket: "job-portal-847bb.firebasestorage.app",
  messagingSenderId: "463078712629",
  appId: "1:463078712629:web:38a5efbdb9b9e6538b987c",
  measurementId: "G-JZXSRYJLQ4"
};

// INIT FIREBASE
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// LOGIN FUNCTION
window.login = async function(e){

    e.preventDefault();

    let email = document.getElementById("username").value.toLowerCase();
    let password = document.getElementById("password").value;

    // ONLY GMAIL ALLOWED
    if (!email.endsWith("@gmail.com")) {
        alert("Only @gmail.com emails are allowed.");
        return;
    }

    try {

        const userCredential =
            await signInWithEmailAndPassword(auth, email, password);

        const user = userCredential.user;

        // 🔥 IMPORTANT FIX (ADD THIS ONLY)
        localStorage.setItem("currentUser", JSON.stringify({
            email: user.email.toLowerCase(),
            name: user.email.split("@")[0]
        }));

        alert("Login Successful!");

        // ADMIN CHECK
        if(user.email === "admin@gmail.com"){
            window.location = "dashboard.html";
        } else {
            window.location = "user-dashboard.html";
        }

    } catch(err) {
        alert(err.message);
    }
}

</script>

</body>
</html>
