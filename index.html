<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#070b16;
}

.wrapper{
    width:900px;
    height:550px;
    display:flex;
    border-radius:20px;
    overflow:hidden;
    background:#0f1424;
}

.left{
    width:50%;
    padding:50px;
    color:#fff;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:15px;
    border:none;
    border-radius:10px;
    background:#1a2035;
    color:#fff;
    outline:none;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:linear-gradient(90deg,#7c5cff,#9f7bff);
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}

.right{
    width:50%;
    background:linear-gradient(135deg,#7c5cff,#9f7bff);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
}
</style>

</head>

<body>

<div class="wrapper">

<div class="left">
    <h1>Login</h1>

    <form onsubmit="login(event)">
        <input id="email" type="email" placeholder="Email" required>
        <input id="password" type="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>
</div>

<div class="right">
    <h2>Job Portal System</h2>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAtFG9KPZgfZRGh8GlOI-hNHSXdI2IMuTw",
  authDomain: "job-portal-847bb.firebaseapp.com",
  projectId: "job-portal-847bb",
  storageBucket: "job-portal-847bb.appspot.com",
  messagingSenderId: "463078712629",
  appId: "1:463078712629:web:38a5efbdb9b9e6538b987c"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// LOGIN FUNCTION
window.login = async function(e){
    e.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);

        const user = userCredential.user;

        alert("Login Successful!");

        // redirect
        if(user.email === "admin@gmail.com"){
            window.location.href = "dashboard.html";
        } else {
            window.location.href = "user-dashboard.html";
        }

    } catch (err) {
        alert(err.message);
    }
}

</script>

</body>
</html>
