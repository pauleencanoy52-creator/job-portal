<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#070b16;
}

.wrapper{
    width:900px;
    height:550px;
    display:flex;
    overflow:hidden;
    border-radius:20px;
    background:#0f1424;
}

.left{
    width:50%;
    padding:50px;
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.left h1{
    margin-bottom:10px;
    font-size:38px;
}

.left p{
    margin-bottom:30px;
    color:#aaa;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:15px;
    border:none;
    border-radius:10px;
    background:#1a2035;
    color:white;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:linear-gradient(90deg,#7c5cff,#9f7bff);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

.link{
    display:block;
    margin-top:20px;
    color:#9f7bff;
    text-decoration:none;
}

.right{
    width:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px;
    background:linear-gradient(135deg,#7c5cff,#9f7bff);
}

.card{
    background:rgba(255,255,255,0.1);
    padding:40px;
    border-radius:20px;
    color:white;
}

.card h2{
    margin-bottom:10px;
    font-size:32px;
}

</style>
</head>

<body>

<div class="wrapper">

    <div class="left">

        <h1>Welcome Back</h1>

        <p>Login to your account</p>

        <form onsubmit="login(event)">

            <input type="email" placeholder="Email" required>

            <input type="password" placeholder="Password" required>

            <button type="submit">
                Login
            </button>

        </form>

        <a href="register.html" class="link">
            No account? Register
        </a>

    </div>

    <div class="right">

        <div class="card">

            <h2>Job Portal System</h2>

            <p>
                Explore jobs and opportunities
            </p>

        </div>

    </div>

</div>

<script>

function login(e){

    e.preventDefault();

    window.location = "user-dashboard.html";

}

</script>

</body>
</html>
