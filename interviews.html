<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interviews</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{
    --primary:#7b5cf0;
    --secondary:#5a3ee6;
    --bg:#f5f6fa;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter', sans-serif;
}

body{ background:var(--bg); }

.container{
    display:flex;
    min-height:100vh;
}

/* SIDEBAR */
.left{
    width:250px;
    background:linear-gradient(135deg,var(--primary),var(--secondary));
    color:#fff;
    padding:25px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
}

.menu{
    margin-top:30px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.menu a{
    color:#fff;
    text-decoration:none;
    padding:12px;
    border-radius:10px;
    transition:0.3s;
}

.menu a:hover{
    background:rgba(255,255,255,0.15);
}

/* MAIN */
.right{
    flex:1;
    padding:30px;
}

/* CARD */
.card{
    background:#fff;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,0.05);
    margin-top:20px;
}

.interview{
    border:1px solid #eee;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
}

input{
    width:100%;
    padding:10px;
    margin:8px 0;
    border:1px solid #ddd;
    border-radius:8px;
}

/* BUTTONS */
button{
    background:var(--primary);
    color:#fff;
    border:none;
    padding:8px 12px;
    border-radius:8px;
    cursor:pointer;
    margin-top:5px;
}

button:hover{ background:var(--secondary); }

.danger{ background:#dc3545; }
.success{ background:#28a745; }
.secondary{ background:#17a2b8; }

</style>
</head>

<body>

<div class="container">

<!-- SIDEBAR -->
<div class="left">
    <div>
        <h2>Job Portal</h2>

        <div class="menu">
            <a href="dashboard.html">Dashboard</a>
            <a href="job-post.html">Post Job</a>
            <a href="applicants.html">Applicants</a>
            <a href="interviews.html">Interviews</a>
            <a href="hired.html">Hired</a>

            <!-- ✅ LOGOUT ADDED -->
            <a href="#" onclick="logout()">Logout</a>
        </div>
    </div>
</div>

<!-- MAIN -->
<div class="right">

<h1>Interviews</h1>

<div class="card" id="interviewList"></div>

</div>
</div>

<script>

// ✅ LOGOUT FUNCTION (FIXED)
function logout(){
    localStorage.removeItem("isLoggedIn");
    window.location.href = "index.html";
}

// GET DATA
function getData(key){
    try{
        return JSON.parse(localStorage.getItem(key)) || [];
    }catch(e){
        return [];
    }
}

// RENDER
function renderInterviews(){

    let interviews = getData("interviews");
    let container = document.getElementById("interviewList");

    if(!interviews.length){
        container.innerHTML = "<p>No interviews yet</p>";
        return;
    }

    container.innerHTML = "";

    interviews.forEach((a,i)=>{

        container.innerHTML += `
        <div class="interview">

            <h3>${a.name}</h3>
            <p>${a.position}</p>

            <p>Date: ${a.date || "Not set"}</p>
            <p>Time: ${a.time || "Not set"}</p>

            <input type="date" id="d${i}">
            <input type="time" id="t${i}">

            <button onclick="schedule(${i})">Schedule</button>
            <button class="secondary" onclick="viewInterview(${i})">View</button>
            <button class="success" onclick="completeInterview(${i})">Complete</button>
            <button class="danger" onclick="rejectInterview(${i})">Reject</button>

        </div>
        `;
    });
}

// SCHEDULE
function schedule(i){
    let interviews = getData("interviews");

    let date = document.getElementById("d"+i).value;
    let time = document.getElementById("t"+i).value;

    if(!date || !time){
        alert("Please fill date & time");
        return;
    }

    interviews[i].date = date;
    interviews[i].time = time;
    interviews[i].status = "Scheduled";

    localStorage.setItem("interviews", JSON.stringify(interviews));

    renderInterviews();
}

// VIEW
function viewInterview(i){
    let interviews = getData("interviews");

    alert(
        interviews[i].name + "\n" +
        interviews[i].position + "\n" +
        (interviews[i].date || "") + " " + (interviews[i].time || "")
    );
}

// COMPLETE
function completeInterview(i){

    let interviews = getData("interviews");
    let hired = getData("hired");

    let c = interviews[i];

    hired.push({
        name: c.name,
        email: (c.email || "").toLowerCase(),
        position: c.position,
        status: "Hired"
    });

    interviews.splice(i,1);

    localStorage.setItem("hired", JSON.stringify(hired));
    localStorage.setItem("interviews", JSON.stringify(interviews));

    renderInterviews();
}

// REJECT
function rejectInterview(i){

    let interviews = getData("interviews");
    let rejected = getData("rejected");

    rejected.push(interviews[i]);

    interviews.splice(i,1);

    localStorage.setItem("rejected", JSON.stringify(rejected));
    localStorage.setItem("interviews", JSON.stringify(interviews));

    renderInterviews();
}

renderInterviews();

</script>

</body>
</html>
