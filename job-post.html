<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Post a Job</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter;}

.container{display:flex;height:100vh;}

.left{
width:25%;
min-width:240px;
background:linear-gradient(135deg,#7b5cf0,#5a3ee6);
color:#fff;
padding:30px;
display:flex;
flex-direction:column;
justify-content:space-between;
}

.menu{
display:flex;
flex-direction:column;
gap:10px;
margin-top:30px;
}

.menu a{
color:#fff;
text-decoration:none;
padding:12px 15px;
border-radius:10px;
opacity:0.85;
}

.menu a:hover{
background:rgba(255,255,255,0.15);
}

.right{
flex:1;
background:#f7f7ff;
padding:40px;
overflow:auto;
}

.card{
background:#fff;
padding:20px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

input,select,textarea{
width:100%;
padding:10px;
margin:8px 0;
border-radius:8px;
border:1px solid #ddd;
}

button{
background:#7b5cf0;
color:#fff;
border:none;
padding:10px 15px;
border-radius:8px;
cursor:pointer;
}

button:hover{background:#5a3ee6;}

.job-item{
background:#fff;
padding:15px;
border-radius:10px;
margin-top:10px;
display:flex;
justify-content:space-between;
align-items:center;
}
</style>
</head>

<body>

<div class="container">

<!-- SIDEBAR -->
<div class="left">
<div>
<h2>Job Portal</h2>

<div class="menu">
<a href="dashboard.html">Dashboard</a>
<a href="job-post.html">Post Job</a>
<a href="applicants.html">Applicants</a>
<a href="interviews.html">Interviews</a>
<a href="hired.html">Hired</a>
<a href="#" onclick="logout()">Logout</a>
</div>

</div>
</div>

<!-- MAIN -->
<div class="right">

<h1>Post a Job</h1>

<div class="card">

<form id="jobForm">

<input id="title" placeholder="Job Title" required>
<input id="company" placeholder="Company" required>

<select id="type">
<option>Full Time</option>
<option>Part Time</option>
<option>Internship</option>
</select>

<textarea id="description" placeholder="Job Description"></textarea>

<input id="skills" placeholder="Skills (comma separated)">

<button type="submit">Post Job</button>

</form>

</div>

<!-- LIST -->
<div class="card" style="margin-top:20px;">
<h3>Posted Jobs</h3>
<div id="jobList"></div>
</div>

</div>

</div>

<script>

function logout(){
localStorage.removeItem("currentUser");
window.location.href = "login.html";
}

/* POST JOB */
document.getElementById("jobForm").addEventListener("submit", function(e){
e.preventDefault();

const job = {
id: Date.now(),
title: document.getElementById("title").value,
company: document.getElementById("company").value,
type: document.getElementById("type").value,
description: document.getElementById("description").value,
skills: document.getElementById("skills").value
    .split(",")
    .map(s => s.trim().toLowerCase())
};

let jobs = JSON.parse(localStorage.getItem("jobs")) || [];
jobs.push(job);

localStorage.setItem("jobs", JSON.stringify(jobs));

alert("Job Posted!");

this.reset();
loadJobs();
});

/* LOAD JOBS */
function loadJobs(){

let jobs = JSON.parse(localStorage.getItem("jobs")) || [];
let container = document.getElementById("jobList");

container.innerHTML = "";

if(jobs.length === 0){
container.innerHTML = "<p>No jobs posted</p>";
return;
}

jobs.forEach(job => {
container.innerHTML += `
<div class="job-item">
<div>
<b>${job.title}</b><br>
${job.company}<br>
<small>${job.type}</small>
<p>${job.description || ""}</p>
</div>

<button onclick="deleteJob(${job.id})">Delete</button>
</div>
`;
});

}

/* DELETE */
function deleteJob(id){
let jobs = JSON.parse(localStorage.getItem("jobs")) || [];
jobs = jobs.filter(j => j.id !== id);
localStorage.setItem("jobs", JSON.stringify(jobs));
loadJobs();
}

/* INIT */
loadJobs();

</script>

</body>
</html>
