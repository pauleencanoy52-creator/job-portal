<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter;}

.container{display:flex;height:100vh;}

/* LEFT */
.left{
width:25%;
min-width:240px;
background:linear-gradient(135deg,#7b5cf0,#5a3ee6);
color:#fff;
padding:30px;
display:flex;
flex-direction:column;
}

.menu{
display:flex;
flex-direction:column;
gap:10px;
margin-top:30px;
}

.menu a{
color:#fff;
text-decoration:none;
padding:12px;
border-radius:10px;
cursor:pointer;
background:rgba(255,255,255,0.05);
}

.menu a:hover{
background:rgba(255,255,255,0.15);
}

/* RIGHT */
.right{
flex:1;
background:#f5f6fa;
padding:40px;
overflow-y:auto;
}

.section{display:none;}
.section.active{display:block;}

.card{
background:#fff;
padding:15px;
border-radius:10px;
margin-bottom:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.05);
cursor:pointer;
}

.card:hover{
transform:scale(1.01);
}

/* APPLY */
input,textarea{
width:100%;
padding:10px;
margin:6px 0;
border:1px solid #ddd;
border-radius:6px;
}

button{
background:#7b5cf0;
color:#fff;
border:none;
padding:10px 14px;
border-radius:6px;
cursor:pointer;
margin-top:8px;
}

button:hover{background:#5a3ee6;}

.skill-box label{
display:inline-block;
background:#fff;
padding:8px 10px;
border:1px solid #ddd;
border-radius:6px;
margin:5px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<!-- LEFT -->
<div class="left">
<h2>User Panel</h2>

<div class="menu">
<a onclick="showTab('dashboard')">Jobs</a>
<a onclick="showTab('notifications')">Notifications</a>
<a onclick="logout()">Logout</a>
</div>
</div>

<!-- RIGHT -->
<div class="right">

<!-- JOBS -->
<div id="dashboard" class="section active">
<h2>Available Jobs</h2>
<div id="jobs"></div>
</div>

<!-- NOTIF -->
<div id="notifications" class="section">
<h2>Notifications</h2>
<div id="notifList"></div>
</div>

<!-- APPLY -->
<div id="applyBox" class="section">
<h2>Apply Job</h2>

<h3 id="jobTitle"></h3>

<h4>Select Skills</h4>
<div id="skillsBox"></div>

<input id="applyName" placeholder="Name">
<input id="applyEmail" readonly>
<textarea id="applyMsg" placeholder="Message"></textarea>

<button onclick="submitApply()">Submit Application</button>
<button onclick="showTab('dashboard')" style="background:#17a2b8;">⬅ Back</button>
</div>

</div>
</div>

<script>

/* USER FROM LOGIN */
let currentUser = JSON.parse(localStorage.getItem("currentUser")) || {};
let userEmail = (currentUser.email || "").toLowerCase().trim();

/* GLOBAL */
let selectedJob = null;
let selectedSkills = [];

/* SWITCH TAB */
function showTab(tab){
document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
document.getElementById(tab).classList.add("active");

if(tab === "notifications") renderNotifications();
}

/* LOGOUT */
function logout(){
localStorage.removeItem("currentUser");
location.href="index.html";
}

/* JOBS */
function renderJobs(){
let jobs = JSON.parse(localStorage.getItem("jobs")) || [];

document.getElementById("jobs").innerHTML =
jobs.length ? jobs.map((j,i)=>`
<div class="card" onclick="selectJob(${i})">
<h3>${j.title}</h3>
<p>${j.company}</p>
</div>
`).join("")
: "<p>No jobs available</p>";
}

/* CLICK JOB */
function selectJob(i){
let jobs = JSON.parse(localStorage.getItem("jobs")) || [];
selectedJob = jobs[i];

selectedSkills = [];

document.getElementById("jobTitle").innerText = selectedJob.title;

/* AUTO EMAIL (IMPORTANT FIX) */
document.getElementById("applyEmail").value = currentUser.email;

/* SKILLS */
let skills = selectedJob.skills || ["HTML","CSS","JS"];

document.getElementById("skillsBox").innerHTML =
skills.map(s=>`
<label>
<input type="checkbox" value="${s}" onchange="toggleSkill(this)">
${s}
</label>
`).join("");

showTab("applyBox");
}

/* SKILL TOGGLE */
function toggleSkill(el){
if(el.checked) selectedSkills.push(el.value);
else selectedSkills = selectedSkills.filter(s=>s!==el.value);
}

/* APPLY */
function submitApply(){

let name = document.getElementById("applyName").value;
let email = document.getElementById("applyEmail").value;
let msg = document.getElementById("applyMsg").value;

let apps = JSON.parse(localStorage.getItem("applicants")) || [];

apps.push({
name,
email,
position: selectedJob.title,
message: msg,
skills: selectedSkills
});

localStorage.setItem("applicants", JSON.stringify(apps));

/* NOTIFICATIONS FIX */
let notif = JSON.parse(localStorage.getItem("notifications")) || [];

notif.push({
email: email,
message: "Applied for " + selectedJob.title,
type: "Applied",
date: new Date().toLocaleString()
});

localStorage.setItem("notifications", JSON.stringify(notif));

alert("Application Sent!");
showTab("notifications");
renderNotifications();
}

/* NOTIFICATIONS FIX */
function renderNotifications(){

let notif = JSON.parse(localStorage.getItem("notifications")) || [];

let my = notif.filter(n =>
(n.email || "").toLowerCase().trim() === userEmail
);

document.getElementById("notifList").innerHTML =
my.length ? my.map(n=>`
<div class="card">
<b>${n.type}:</b> ${n.message}
<br><small>${n.date}</small>
</div>
`).join("")
: "<p>No notifications yet</p>";
}

/* AUTO UPDATE */
setInterval(renderNotifications, 1500);

/* INIT */
renderJobs();
renderNotifications();

</script>

</body>
</html>
