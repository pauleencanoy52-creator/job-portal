<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter;}

.container{display:flex;height:100vh;}

.left{
width:25%;
min-width:240px;
background:linear-gradient(135deg,#7b5cf0,#5a3ee6);
color:#fff;
padding:30px;
display:flex;
flex-direction:column;
justify-content:space-between;
}

.menu{
display:flex;
flex-direction:column;
gap:10px;
margin-top:30px;
}

.menu a{
color:#fff;
text-decoration:none;
padding:12px 15px;
border-radius:10px;
cursor:pointer;
opacity:0.85;
transition:0.3s;
}

.menu a:hover{
background:rgba(255,255,255,0.15);
transform:translateX(5px);
opacity:1;
}

.right{
flex:1;
background:#f5f6fa;
padding:40px;
overflow-y:auto;
}

.section{display:none;}
.section.active{display:block;}

.card{
background:#fff;
padding:15px;
border-radius:10px;
margin-bottom:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.05);
cursor:pointer;
}

input,textarea{
width:100%;
padding:8px;
margin:5px 0;
border:1px solid #ddd;
border-radius:6px;
}

button{
background:#7b5cf0;
color:#fff;
border:none;
padding:8px 12px;
border-radius:6px;
cursor:pointer;
margin-top:8px;
}

button:hover{background:#5a3ee6;}

.skill-box{
display:flex;
flex-wrap:wrap;
gap:8px;
margin-top:10px;
}

.skill-box label{
background:#fff;
padding:8px 10px;
border-radius:6px;
border:1px solid #ddd;
cursor:pointer;
display:flex;
gap:6px;
align-items:center;
font-size:14px;
}
</style>
</head>

<body>

<div class="container">

<!-- SIDEBAR -->
<div class="left">
<div>
<h2>User Panel</h2>

<div class="menu">
<a onclick="showTab('dashboard')">Jobs</a>
<a onclick="showTab('notifications')">Notifications</a>
<a onclick="showTab('profile')">Profile</a>
<a onclick="logout()">Logout</a>
</div>

</div>
</div>

<!-- MAIN -->
<div class="right">

<div id="dashboard" class="section active">
<h2>Available Jobs</h2>
<div id="jobs"></div>
</div>

<div id="notifications" class="section">
<h2>Notifications</h2>
<div id="notifList"></div>
</div>

<div id="profile" class="section">
<h2>Profile</h2>

<input id="pname" placeholder="Full Name">
<input id="pemail" placeholder="Email">
<input id="pphone" placeholder="Phone">

<button onclick="saveProfile()">Save Profile</button>
</div>

<div id="applyBox" class="section">
<h2>Apply Job</h2>

<h3 id="jobTitle"></h3>

<div id="skillApplyBox" class="skill-box"></div>

<input id="applyName" placeholder="Name">
<input id="applyEmail" placeholder="Email">
<textarea id="applyMsg" placeholder="Message"></textarea>

<button onclick="submitApply()">Submit Application</button>
<button onclick="goBackJobs()" style="background:#17a2b8;">⬅ Back</button>

</div>

</div>
</div>

<script>

let currentUser = JSON.parse(localStorage.getItem("currentUser")) || {};
currentUser.email = (currentUser.email || "").toLowerCase();

let selectedJob = null;
let selectedSkills = [];

/* NAV */
function showTab(tab){
document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
document.getElementById(tab).classList.add("active");

if(tab === "notifications") renderNotifications();
if(tab === "dashboard") renderJobs();
}

/* LOGOUT */
function logout(){
localStorage.removeItem("currentUser");
window.location.href = "login.html";
}

/* BACK */
function goBackJobs(){
showTab("dashboard");
renderJobs();
}

/* JOBS */
function renderJobs(){
let jobs = JSON.parse(localStorage.getItem("jobs")) || [];

document.getElementById("jobs").innerHTML =
jobs.length === 0
? "<p>No jobs available</p>"
: jobs.map((j,i)=>`
<div class="card" onclick="selectJob(${i})">
<h3>${j.title || "No Title"}</h3>
<p>${j.company || ""}</p>
</div>
`).join("");
}

/* SELECT JOB */
function selectJob(i){
let jobs = JSON.parse(localStorage.getItem("jobs")) || [];
selectedJob = jobs[i];

selectedSkills = [];

document.getElementById("jobTitle").innerText = selectedJob.title;

renderApplySkills();

document.getElementById("applyName").value = currentUser.name || "";
document.getElementById("applyEmail").value = currentUser.email || "";
document.getElementById("applyMsg").value = "";

showTab("applyBox");
}

/* SKILLS */
function renderApplySkills(){
let skills = selectedJob?.skills?.length ? selectedJob.skills : ["HTML","CSS","JS"];

document.getElementById("skillApplyBox").innerHTML =
skills.map(skill=>`
<label>
<input type="checkbox" value="${skill.toLowerCase()}" onchange="toggleSkill(this)">
${skill}
</label>
`).join("");
}

function toggleSkill(el){
if(el.checked){
selectedSkills.push(el.value);
}else{
selectedSkills = selectedSkills.filter(s=>s!==el.value);
}
}

/* APPLY */
function submitApply(){

let name = document.getElementById("applyName").value;
let email = document.getElementById("applyEmail").value.toLowerCase();
let msg = document.getElementById("applyMsg").value;

if(!name || !email || !msg){
alert("Fill all fields!");
return;
}

let applicants = JSON.parse(localStorage.getItem("applicants")) || [];

applicants.push({
name,
email,
position: selectedJob?.title || "",
message: msg,
skills: selectedSkills,
status: "Applied"
});

localStorage.setItem("applicants", JSON.stringify(applicants));

let notifications = JSON.parse(localStorage.getItem("notifications")) || [];

notifications.push({
email,
message: "Applied for " + selectedJob.title,
type: "Applied",
date: new Date().toLocaleString()
});

localStorage.setItem("notifications", JSON.stringify(notifications));

alert("Application Sent!");

showTab("notifications");
renderNotifications();
}

/* NOTIFICATIONS */
function renderNotifications(){

let notifications = JSON.parse(localStorage.getItem("notifications")) || [];

let myEmail = (currentUser.email || "").toLowerCase();

let myNotifs = notifications.filter(n =>
(n.email || "").toLowerCase() === myEmail
);

document.getElementById("notifList").innerHTML =
myNotifs.length === 0
? "<p>No notifications yet</p>"
: myNotifs.map((n)=>`
<div class="card">
<p><b>${n.type || "Info"}:</b> ${n.message}</p>
<small>${n.date || ""}</small>
</div>
`).join("");
}

setInterval(renderNotifications, 3000);

/* PROFILE */
function saveProfile(){
let profile = {
name: document.getElementById("pname").value,
email: document.getElementById("pemail").value.toLowerCase(),
phone: document.getElementById("pphone").value
};

currentUser = profile;
localStorage.setItem("currentUser", JSON.stringify(profile));

alert("Profile Saved!");
}

/* INIT */
renderJobs();
renderNotifications();

</script>

</body>
</html>
