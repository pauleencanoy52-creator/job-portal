<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter;}

.container{display:flex;height:100vh;}

.left{
width:25%;
min-width:240px;
background:linear-gradient(135deg,#7b5cf0,#5a3ee6);
color:#fff;
padding:30px;
display:flex;
flex-direction:column;
}

.menu{
display:flex;
flex-direction:column;
gap:10px;
margin-top:30px;
}

.menu a{
color:#fff;
text-decoration:none;
padding:12px;
border-radius:10px;
cursor:pointer;
}

.menu a:hover{background:rgba(255,255,255,0.15);}

.right{
flex:1;
background:#f5f6fa;
padding:40px;
overflow-y:auto;
}

.section{display:none;}
.section.active{display:block;}

.card{
background:#fff;
padding:15px;
border-radius:10px;
margin-bottom:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.05);
}
</style>
</head>

<body>

<div class="container">

<div class="left">
<div>
<h2>User Panel</h2>

<div class="menu">
<a onclick="showTab('dashboard')">Jobs</a>
<a onclick="showTab('notifications')">Notifications</a>
<a onclick="showTab('profile')">Profile</a>
<a onclick="logout()">Logout</a>
</div>

</div>
</div>

<div class="right">

<div id="dashboard" class="section active">
<h2>Available Jobs</h2>
<div id="jobs"></div>
</div>

<div id="notifications" class="section">
<h2>Notifications</h2>
<div id="notifList"></div>
</div>

</div>
</div>

<script>

let currentUser = JSON.parse(localStorage.getItem("currentUser")) || {};
let userEmail = (currentUser.email || "").toLowerCase().trim();

/* TAB */
function showTab(tab){
document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
document.getElementById(tab).classList.add("active");
renderNotifications();
}

/* LOGOUT */
function logout(){
localStorage.removeItem("currentUser");
location.href="index.html";
}

/* JOBS */
function renderJobs(){
let jobs = JSON.parse(localStorage.getItem("jobs")) || [];

document.getElementById("jobs").innerHTML =
jobs.length === 0
? "<p>No jobs available</p>"
: jobs.map(j=>`
<div class="card">
<h3>${j.title}</h3>
<p>${j.company}</p>
</div>
`).join("");
}

/* 🔥 FIXED NOTIFICATIONS */
function renderNotifications(){

let notifications = JSON.parse(localStorage.getItem("notifications")) || [];

/* IMPORTANT FIX */
let myNotifs = notifications.filter(n =>
(n.email || "").toLowerCase().trim() === userEmail
);

let box = document.getElementById("notifList");

if(myNotifs.length === 0){
box.innerHTML = "<p>No notifications yet</p>";
return;
}

box.innerHTML = myNotifs.map(n=>`
<div class="card">
<p>
<b>${n.type || "Info"}:</b> ${n.message}
</p>
<small>${n.date || ""}</small>
</div>
`).join("");
}

/* REALTIME UPDATE */
setInterval(renderNotifications, 1500);

renderJobs();
renderNotifications();

</script>

</body>
</html>
