<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter;}

.container{display:flex;height:100vh;}

.left{
width:25%;
min-width:240px;
background:linear-gradient(135deg,#7b5cf0,#5a3ee6);
color:#fff;
padding:30px;
display:flex;
flex-direction:column;
}

.menu{
display:flex;
flex-direction:column;
gap:10px;
margin-top:30px;
}

.menu a{
color:#fff;
text-decoration:none;
padding:12px;
border-radius:10px;
cursor:pointer;
}

.menu a:hover{background:rgba(255,255,255,0.15);}

.right{
flex:1;
background:#f5f6fa;
padding:40px;
overflow-y:auto;
}

.section{display:none;}
.section.active{display:block;}

.card{
background:#fff;
padding:15px;
border-radius:10px;
margin-bottom:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.05);
cursor:pointer;
}

button{
background:#7b5cf0;
color:#fff;
border:none;
padding:10px;
border-radius:8px;
cursor:pointer;
}
button:hover{opacity:0.9;}
</style>
</head>

<body>

<div class="container">

<!-- SIDEBAR -->
<div class="left">
<h2>User Panel</h2>

<div class="menu">
<a onclick="showTab('dashboard')">Jobs</a>
<a onclick="showTab('notifications')">Notifications</a>
<a onclick="logout()">Logout</a>
</div>
</div>

<!-- MAIN -->
<div class="right">

<!-- JOBS -->
<div id="dashboard" class="section active">
<h2>Available Jobs</h2>
<div id="jobs"></div>
</div>

<!-- APPLY VIEW -->
<div id="applyBox" class="section">
<h2>Apply Job</h2>

<h3 id="jobTitle"></h3>

<input id="name" placeholder="Your Name">
<input id="email" placeholder="Your Email">
<textarea id="msg" placeholder="Message"></textarea>

<button onclick="submitApply()">Submit Application</button>
<button onclick="showTab('dashboard')" style="background:#17a2b8;">Back</button>
</div>

<!-- NOTIFICATIONS -->
<div id="notifications" class="section">
<h2>Notifications</h2>
<div id="notifList"></div>
</div>

</div>
</div>

<script>

/* =====================
   USER EMAIL
===================== */
function getUserEmail(){
return (JSON.parse(localStorage.getItem("currentUser"))?.email || "").toLowerCase().trim();
}

/* =====================
   TAB SYSTEM
===================== */
function showTab(tab){
document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
document.getElementById(tab).classList.add("active");
renderNotifications();
}

/* =====================
   LOGOUT
===================== */
function logout(){
localStorage.removeItem("currentUser");
window.location.href="index.html";
}

/* =====================
   CLICK JOB
===================== */
let selectedJob = null;

function renderJobs(){
let jobs = JSON.parse(localStorage.getItem("jobs")) || [];

document.getElementById("jobs").innerHTML =
jobs.length === 0
? "<p>No jobs available</p>"
: jobs.map((j,i)=>`
<div class="card" onclick="openJob(${i})">
<h3>${j.title}</h3>
<p>${j.company}</p>
</div>
`).join("");
}

function openJob(i){
let jobs = JSON.parse(localStorage.getItem("jobs")) || [];
selectedJob = jobs[i];

document.getElementById("jobTitle").innerText = selectedJob.title;

document.getElementById("name").value = "";
document.getElementById("email").value = getUserEmail();

showTab("applyBox");
}

/* =====================
   APPLY + NOTIF
===================== */
function submitApply(){

let notifications = JSON.parse(localStorage.getItem("notifications")) || [];

notifications.push({
email: getUserEmail(),
message: "Applied for " + selectedJob.title,
type: "Applied",
date: new Date().toLocaleString()
});

localStorage.setItem("notifications", JSON.stringify(notifications));

alert("Application Sent!");
showTab("notifications");
renderNotifications();
}

/* =====================
   NOTIFICATIONS FIX
===================== */
function renderNotifications(){

let notifications = JSON.parse(localStorage.getItem("notifications")) || [];
let myEmail = getUserEmail();

let myNotifs = notifications.filter(n =>
(n.email || "").toLowerCase().trim() === myEmail
);

let box = document.getElementById("notifList");

box.innerHTML =
myNotifs.length === 0
? "<p>No notifications yet</p>"
: myNotifs.map(n=>`
<div class="card">
<b>${n.type}</b> - ${n.message}
<br><small>${n.date}</small>
</div>
`).join("");
}

/* =====================
   INIT
===================== */
renderJobs();
renderNotifications();

setInterval(renderNotifications, 1500);

</script>

</body>
</html>
