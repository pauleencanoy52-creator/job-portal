<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter;}

.container{display:flex;height:100vh;}

.left{
width:25%;
min-width:240px;
background:linear-gradient(135deg,#7b5cf0,#5a3ee6);
color:#fff;
padding:30px;
display:flex;
flex-direction:column;
}

.menu{
display:flex;
flex-direction:column;
gap:10px;
margin-top:30px;
}

.menu a{
color:#fff;
text-decoration:none;
padding:12px;
border-radius:10px;
cursor:pointer;
}

.menu a:hover{background:rgba(255,255,255,0.15);}

.right{
flex:1;
background:#f5f6fa;
padding:40px;
overflow-y:auto;
}

.section{display:none;}
.section.active{display:block;}

.card{
background:#fff;
padding:15px;
border-radius:10px;
margin-bottom:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.05);
cursor:pointer;
}

input,textarea{
width:100%;
padding:8px;
margin:5px 0;
border:1px solid #ddd;
border-radius:6px;
}

button{
padding:8px 12px;
border:none;
border-radius:6px;
cursor:pointer;
margin-top:8px;
}

</style>
</head>

<body>

<div class="container">

<!-- SIDEBAR -->
<div class="left">
<h2>User Panel</h2>

<div class="menu">
<a onclick="showTab('dashboard')">Jobs</a>
<a onclick="showTab('notifications')">Notifications</a>
<a onclick="logout()">Logout</a>
</div>
</div>

<!-- MAIN -->
<div class="right">

<!-- JOBS -->
<div id="dashboard" class="section active">
<h2>Available Jobs</h2>
<div id="jobs"></div>
</div>

<!-- NOTIFICATIONS -->
<div id="notifications" class="section">
<h2>Notifications</h2>
<div id="notifList"></div>
</div>

<!-- APPLY -->
<div id="applyBox" class="section">
<h2>Apply Job</h2>

<h3 id="jobTitle"></h3>

<h4>Select Skills</h4>
<div id="skillsBox"></div>

<input id="applyName" placeholder="Name">
<input id="applyEmail" placeholder="Email" readonly>
<textarea id="applyMsg" placeholder="Message"></textarea>

<button onclick="submitApply()">Submit Application</button>
<button onclick="showTab('dashboard')">⬅ Back</button>
</div>

</div>
</div>

<script>

/* =========================
   GET USER FROM LOGIN
========================= */
let currentUser = JSON.parse(localStorage.getItem("currentUser")) || {};
let userEmail = (currentUser.email || "").toLowerCase().trim();

/* =========================
   GLOBAL
========================= */
let selectedJob = null;
let selectedSkills = [];

/* =========================
   TAB SWITCH
========================= */
function showTab(tab){
document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
document.getElementById(tab).classList.add("active");

if(tab === "notifications") renderNotifications();
}

/* =========================
   LOGOUT
========================= */
function logout(){
localStorage.removeItem("currentUser");
window.location.href = "index.html";
}

/* =========================
   RENDER JOBS (CLICKABLE FIX)
========================= */
function renderJobs(){
let jobs = JSON.parse(localStorage.getItem("jobs")) || [];

document.getElementById("jobs").innerHTML =
jobs.length === 0
? "<p>No jobs available</p>"
: jobs.map((j,i)=>`
<div class="card" onclick="selectJob(${i})">
<h3>${j.title}</h3>
<p>${j.company}</p>
</div>
`).join("");
}

/* =========================
   SELECT JOB (FIX CLICK)
========================= */
function selectJob(i){
let jobs = JSON.parse(localStorage.getItem("jobs")) || [];

selectedJob = jobs[i];
selectedSkills = [];

document.getElementById("jobTitle").innerText = selectedJob.title;

/* AUTO EMAIL FROM LOGIN */
document.getElementById("applyEmail").value = userEmail;
document.getElementById("applyName").value = currentUser.name || "";

/* SKILLS */
let skills = selectedJob.skills || ["HTML","CSS","JS"];

document.getElementById("skillsBox").innerHTML =
skills.map(s=>`
<label>
<input type="checkbox" value="${s}" onchange="toggleSkill(this)">
${s}
</label>
`).join("");

showTab("applyBox");
}

/* =========================
   TOGGLE SKILL
========================= */
function toggleSkill(el){
if(el.checked){
selectedSkills.push(el.value);
}else{
selectedSkills = selectedSkills.filter(s=>s!==el.value);
}
}

/* =========================
   SUBMIT APPLICATION
========================= */
function submitApply(){

let name = document.getElementById("applyName").value;
let email = document.getElementById("applyEmail").value;
let msg = document.getElementById("applyMsg").value;

let applicants = JSON.parse(localStorage.getItem("applicants")) || [];

applicants.push({
name,
email,
position: selectedJob.title,
message: msg,
skills: selectedSkills
});

localStorage.setItem("applicants", JSON.stringify(applicants));

/* NOTIFICATION FIX */
let notifications = JSON.parse(localStorage.getItem("notifications")) || [];

notifications.push({
email: email,
message: "Applied for " + selectedJob.title,
type: "Applied",
date: new Date().toLocaleString()
});

localStorage.setItem("notifications", JSON.stringify(notifications));

alert("Application Sent!");

showTab("notifications");
renderNotifications();
}

/* =========================
   FIXED NOTIFICATIONS
========================= */
function renderNotifications(){

let notifications = JSON.parse(localStorage.getItem("notifications")) || [];

let myNotifs = notifications.filter(n =>
(n.email || "").toLowerCase().trim() === userEmail
);

document.getElementById("notifList").innerHTML =
myNotifs.length === 0
? "<p>No notifications yet</p>"
: myNotifs.map(n=>`
<div class="card">
<b>${n.type}:</b> ${n.message}<br>
<small>${n.date}</small>
</div>
`).join("");
}

/* AUTO UPDATE */
setInterval(renderNotifications, 1500);

/* INIT */
renderJobs();
renderNotifications();

</script>

</body>
</html>
