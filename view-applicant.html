<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>View Applicant</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Inter;
}

.container { display: flex; height: 100vh; }

.left {
    width: 25%;
    min-width: 240px;
    background: linear-gradient(135deg, #7b5cf0, #5a3ee6);
    color: #fff;
    padding: 30px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.menu {
    margin-top: 30px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.menu a {
    color: #fff;
    text-decoration: none;
    padding: 12px 15px;
    border-radius: 10px;
    opacity: 0.85;
}

.menu a:hover {
    background: rgba(255,255,255,0.15);
}

.right {
    flex: 1;
    background: #f7f7ff;
    padding: 40px;
}

.header {
    display: flex;
    justify-content: space-between;
}

.card-box {
    margin-top: 25px;
    background: #fff;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
}

.info p {
    margin: 6px 0;
    color: #555;
}

.btn-group {
    margin-top: 20px;
    display: flex;
    gap: 10px;
}

.btn {
    border: none;
    padding: 10px 15px;
    border-radius: 8px;
    cursor: pointer;
}

.accept { background:#28a745; color:#fff; }
.reject { background:#dc3545; color:#fff; }
.back { background:#7b5cf0; color:#fff; }

.btn:hover { opacity: 0.85; }

</style>
</head>

<body>

<div class="container">

<!-- SIDEBAR -->
<div class="left">
<div>
<h2>Job Portal</h2>

<div class="menu">
<a href="dashboard.html">Dashboard</a>
<a href="job-post.html">Post Job</a>
<a href="applicants.html">Applicants</a>
<a href="interviews.html">Interviews</a>
<a href="hired.html">Hired</a>
</div>

</div>
</div>

<!-- MAIN -->
<div class="right">

<div class="header">
<h1>Applicant Details</h1>
<span>Admin Panel</span>
</div>

<div class="card-box">

<div class="info">
<h3 id="name"></h3>
<p><b>Email:</b> <span id="email"></span></p>
<p><b>Position:</b> <span id="position"></span></p>
<p><b>Message:</b> <span id="message"></span></p>
<p><b>Skills:</b> <span id="skills"></span></p>
</div>

<div class="btn-group">
<button class="btn accept" onclick="acceptApplicant()">Accept</button>
<button class="btn reject" onclick="rejectApplicant()">Reject</button>
<button class="btn back" onclick="window.location.href='applicants.html'">Back</button>
</div>

</div>

</div>

</div>

<script>

let applicant = JSON.parse(localStorage.getItem("selectedApplicant"));
let applicants = JSON.parse(localStorage.getItem("applicants")) || [];
let interviews = JSON.parse(localStorage.getItem("interviews")) || [];

if (!applicant) {
    alert("No applicant selected!");
    window.location.href = "applicants.html";
}

/* SHOW DATA */
document.getElementById("name").innerText = applicant.name || "";
document.getElementById("email").innerText = applicant.email || "";
document.getElementById("position").innerText = applicant.position || "";
document.getElementById("message").innerText = applicant.message || "";
document.getElementById("skills").innerText = (applicant.skills || []).join(", ");

/* ACCEPT */
function acceptApplicant() {

    interviews.push(applicant);
    localStorage.setItem("interviews", JSON.stringify(interviews));

    applicants = applicants.filter(a => a.email !== applicant.email);
    localStorage.setItem("applicants", JSON.stringify(applicants));

    localStorage.removeItem("selectedApplicant");

    window.location.href = "interviews.html";
}

/* REJECT */
function rejectApplicant() {

    applicants = applicants.filter(a => a.email !== applicant.email);
    localStorage.setItem("applicants", JSON.stringify(applicants));

    localStorage.removeItem("selectedApplicant");

    window.location.href = "applicants.html";
}

</script>

</body>
</html>
